<article class="max-w-full prose dark:prose-invert">
  {{ with "What up! I'm Victor" }}

      <h1>{{ . | emojify }}</h1>
    </header>
  {{ end }}

  {{ with "Featured Projects: " }}
    <header>
      <h3>{{ . | emojify }}</h3>
    </header>
  {{ end }}

  <section class="w-full">{{ .Content }}</section>
</article>
<section>
  {{ partial "featured-articles/main.html" . }}
</section>
